{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="petal-overlay" aria-hidden="true"></div>

<div style="text-align: center; padding: 4rem 2rem 0 2rem; position: relative; z-index: 1;">
    <p style="font-family: 'Cormorant'; font-size: 1.75rem; color: #6b6b6b; margin: 0 0 1rem 0; font-weight: 300; letter-spacing: 0.05em;">Saturday, June 13, 2026</p>
    <h1 style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 4rem; font-weight: 500; margin: 0; color: #2b2b2b; letter-spacing: 0.02em;">
        MEGAN &amp; STEPHEN
    </h1>
    <img src="{% static 'rose-border-2.png' %}" alt="Floral border" style="max-width: 800px; width: 100%; height: auto; display: block; margin: 1.25rem auto 2rem;" />
    <div style="text-align: center;">
        <div style="max-width: 900px; width: 100%; margin: 0 auto 2rem auto;">
        <img src="{% static 'collage.png' %}" alt="Megan and Stephen collage" style="max-width: 900px; width: 100%; height: auto; display: block; margin: 0 auto 2rem; border-radius: 12px; box-shadow: 0 10px 26px rgba(0,0,0,0.12);" />
        <div style="display: flex; flex-direction: row; gap: 2rem; justify-content: center; flex-wrap: wrap;">
            <div style="background: #4c2a4f; padding: 1.5rem 2rem; border-radius: 8px; flex: 1 1 360px;">
                <p style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.2rem; font-weight: bold; color: #ffffff; margin: 0 0 0.75rem 0;">3 p.m. | Ceremony</p>
                <p style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.2rem; color: #f5f5f5; margin: 0 0 0.25rem 0;">Proclamation Presbyterian Church</p>
                <p style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.1rem; color: #e0e0e0; margin: 0;">278 S Bryn Mawr Ave</p>
                <p style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.1rem; color: #e0e0e0; margin: 0 0 0.25rem 0;">Bryn Mawr, PA</p>
            </div>
            <div style="background: #4c2a4f; padding: 1.5rem 2rem; border-radius: 8px; flex: 1 1 360px;">
                <p style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.2rem; font-weight: bold; color: #ffffff; margin: 0 0 0.75rem 0;">5 p.m. | Cocktails & Reception</p>
                <p style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.2rem; color: #f5f5f5; margin: 0 0 0.25rem 0;">Kings Mills</p>
                <p style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.1rem; color: #e0e0e0; margin: 0;">6000 Pennell Rd</p>
                <p style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.1rem; color: #e0e0e0; margin: 0 0 0.25rem 0;">Media, PA</p>
            </div>
        </div>

        <a href="{% url 'rsvp' %}" style="display: block; width: 100%; padding: 1rem 2rem; background: #4c2a4f; color: white; border: 2px solid #4c2a4f; border-radius: 8px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.25rem; margin: 1.5rem auto 0 auto; text-decoration: none; transition: all 0.3s ease;">
            RSVP Here
        </a>
        </div>
        <img src="{% static 'rose-border-2.png' %}" alt="Floral border" style="max-width: 800px; width: 100%; height: auto; display: block; margin: 2rem auto 4rem;" />
    </div>
</div>

<style>
.petal-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.petal {
    position: absolute;
    top: -10vh;
    width: var(--petal-size, 14px);
    height: calc(var(--petal-size, 14px) * 1.25);
    opacity: var(--petal-opacity, 0.7);
    transform: translate3d(0, 0, 0) rotate(var(--petal-rot, 0deg));
    animation:
        petal-fall var(--petal-fall-dur, 10s) linear var(--petal-delay, 0s) infinite,
        petal-sway var(--petal-sway-dur, 4s) ease-in-out var(--petal-delay, 0s) infinite;
    will-change: transform;
}

.petal::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(243, 192, 198, 0.75); /* rosewater */
    border-radius: 999px 999px 999px 999px;
    transform: rotate(18deg);
    box-shadow: 0 6px 16px rgba(76, 42, 79, 0.08);
}

@keyframes petal-fall {
    from { transform: translate3d(0, -10vh, 0) rotate(var(--petal-rot, 0deg)); }
    to { transform: translate3d(0, 120vh, 0) rotate(calc(var(--petal-rot, 0deg) + 540deg)); }
}

@keyframes petal-sway {
    0%, 100% { margin-left: 0; }
    50% { margin-left: var(--petal-sway, 40px); }
}

@media (prefers-reduced-motion: reduce) {
    .petal-overlay { display: none; }
}
</style>

<script>
(function() {
    const overlay = document.querySelector('.petal-overlay');
    if (!overlay) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const count = 18;
    for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'petal';

        const size = 10 + Math.random() * 10; // 10-20
        const left = Math.random() * 100; // vw
        const opacity = 0.35 + Math.random() * 0.5;
        const fallDur = 10 + Math.random() * 8; // 10-18s
        const swayDur = 3 + Math.random() * 3.5; // 3-6.5s
        const delay = -(Math.random() * fallDur); // start mid-animation
        const sway = (Math.random() * 70 - 35); // -35..35 px
        const rot = (Math.random() * 360) + 'deg';

        el.style.left = left + 'vw';
        el.style.setProperty('--petal-size', size + 'px');
        el.style.setProperty('--petal-opacity', opacity.toFixed(2));
        el.style.setProperty('--petal-fall-dur', fallDur.toFixed(2) + 's');
        el.style.setProperty('--petal-sway-dur', swayDur.toFixed(2) + 's');
        el.style.setProperty('--petal-delay', delay.toFixed(2) + 's');
        el.style.setProperty('--petal-sway', sway.toFixed(0) + 'px');
        el.style.setProperty('--petal-rot', rot);

        overlay.appendChild(el);
    }
})();
</script>
{% endblock %}
